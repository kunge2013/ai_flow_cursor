server:
  port: 8061 # 服务器端口配置
spring:
  thymeleaf:
    enabled: true
    check-template-location: true
    prefix: classpath:/static/
    mvc:
      view:
        prefix: /static/
        suffix: .html
      static-path-pattern: /static/**
    resources:
      static-locations: classpath:/static/
  web:
    resources:
      static-locations: classpath:/static/
  ai:
    dashscope:
      api-key:
    mcp:
      server:
        name: xiyan-server    # MCP服务器名称
        version: 0.0.1           # 服务器版本号
    vectorstore:
      analytic:
        collectName: chatBi
        regionId: cn-hangzhou
        dbInstanceId:
        managerAccount:
        managerAccountPassword:
        namespace: chat
        namespacePassword: chat
        defaultTopK: 6
        defaultSimilarityThreshold: 0.75
        accessKeyId:
        accessKeySecret:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key:
      model: qwen-max
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/chat?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

chatBi:
  dbConfig:
    url: jdbc:mysql://localhost:3307/chat
    username: root
    password: 123456
    schema: chat
    connection-type: jdbc
    dialect-type: mysql
